# Compila la app de Android (APK de prueba) y el instalador para computador (Windows) de Nuestro Hogar y los deja
# en Releases, en la misma versión.
name: APK Android

on:
  push:
    branches: [claude/supermarket-mania-minigame-xn2it8]
    paths: ['juego/web/**', 'juego/escritorio/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juego/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: juego/web/android/**/*.gradle*

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el juego web
        env:
          # Opcional: variables del repositorio con el servidor de la pareja (Supabase)
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Quitar la copia de modelos sin WebAssembly (la app no la necesita)
        run: rm -rf dist/modelos-plano

      - name: Copiar el juego al proyecto de Android
        run: npx cap sync android

      - name: Compilar la APK
        working-directory: juego/web/android
        env:
          NUMERO_VERSION: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nombrar la APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NuestroHogar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NuestroHogar-apk
          path: juego/web/NuestroHogar.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Nuestro Hogar · APK de prueba ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: juego/web/NuestroHogar.apk
          body: |
            APK de prueba de Nuestro Hogar: la mascota de pareja (casa con sala, cocina, baño y cuarto; necesidades,
            mimos, regalos, notas en la nevera, álbum de fotos y fechas especiales) con el minijuego Súper Manía.

            Para instalar en Android: descarga NuestroHogar.apk, ábrela y permite «instalar apps de fuentes desconocidas» cuando el celular lo pida.
            Para el computador (Windows 10 u 11): descarga NuestroHogar.exe (aparece unos minutos después que la APK) y ábrelo; si Windows
            dice «Windows protegió su PC», toca «Más información» y «Ejecutar de todas formas». F11: pantalla completa; Esc: atrás.
            Se instala encima de la versión anterior (Súper Manía) sin perder el progreso del súper.

  # El mismo juego para computador: Electron con el juego compilado adentro; se sube a la misma versión de la APK
  exe:
    needs: apk
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: juego/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el juego web
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copiar el juego al programa de escritorio
        run: |
          rm -rf dist/modelos-plano ../escritorio/juego
          cp -r dist ../escritorio/juego

      - name: Armar el instalador de Windows
        working-directory: juego/escritorio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm pkg set version=1.0.${{ github.run_number }}
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: NuestroHogar-exe
          path: juego/escritorio/salida/NuestroHogar.exe

      - name: Publicar en Releases (junto a la APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: juego/escritorio/salida/NuestroHogar.exe

  # ------------------------------------------------------------------------------------------------------------
  # La versión para AMIGOS (app aparte «Sala de Juegos»): solo la sala de juegos de amigos y sus juegos, sin NADA de
  # la pareja (npm run build:amigos revisa con scripts/verificar-amigos.mjs que no quede ni una palabra; si encuentra
  # algo, falla y no se publica). Otro id de aplicación: se instala al lado de Nuestro Hogar. Va después de la APK de
  # la pareja (a la misma versión de Releases) y si falla no la toca.
  apk-amigos:
    needs: apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juego/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: juego/web/android/**/*.gradle*

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la versión para amigos (y revisar que no tenga nada de la pareja)
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build:amigos

      - name: Convertir el proyecto de Android en «Sala de Juegos» (id, nombre, ícono y pantalla de arranque)
        run: |
          rm -rf dist-amigos/modelos-plano
          node scripts/android-amigos.mjs

      - name: Copiar el juego al proyecto de Android
        env:
          NH_AMIGOS: '1'
        run: npx cap sync android

      - name: Compilar la APK
        working-directory: juego/web/android
        env:
          NUMERO_VERSION: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Nombrar la APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NuestroHogar-Amigos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NuestroHogar-Amigos-apk
          path: juego/web/NuestroHogar-Amigos.apk

      - name: Publicar en Releases (junto a la de la pareja)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: juego/web/NuestroHogar-Amigos.apk

  # El programa de computador para amigos: el mismo Electron, con la versión para amigos adentro, otro nombre, otro
  # ícono y otros puertos (las dos apps pueden estar abiertas a la vez sin mezclar lo guardado).
  exe-amigos:
    needs: apk
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: juego/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la versión para amigos (y revisar que no tenga nada de la pareja)
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: npm run build:amigos

      - name: Copiar el juego al programa de escritorio
        run: |
          rm -rf dist-amigos/modelos-plano ../escritorio/juego
          cp -r dist-amigos ../escritorio/juego

      - name: Armar el instalador de Windows («Sala de Juegos»)
        working-directory: juego/escritorio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          cp build-amigos/icon.png build-amigos/icon.ico build/
          npm install --no-audit --no-fund
          npm pkg set version=1.0.${{ github.run_number }} name=sala-de-juegos-escritorio productName="Sala de Juegos"
          npm pkg set build.appId=com.javialexis.salajuegos build.productName="Sala de Juegos"
          npm pkg set build.nsis.shortcutName="Sala de Juegos" build.nsis.artifactName=NuestroHogar-Amigos.exe
          npm pkg set puertos='[47625,47626,47627,47628]' --json
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: NuestroHogar-Amigos-exe
          path: juego/escritorio/salida/NuestroHogar-Amigos.exe

      - name: Publicar en Releases (junto a la de la pareja)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: juego/escritorio/salida/NuestroHogar-Amigos.exe
