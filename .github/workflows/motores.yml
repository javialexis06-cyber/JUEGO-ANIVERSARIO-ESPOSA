name: Motores de los juegos
on:
  push:
    paths: ['juego/web/src/mesa/**', 'juego/web/src/casa/show_casa.ts', 'juego/web/src/casa/pregunta_dia.ts', 'juego/web/src/casa/cocina/**', 'juego/web/src/casa/cohete.ts', 'juego/web/src/casa/cohete/**', 'juego/web/src/casa/main.ts', 'juego/web/src/sueltos/**', 'juego/web/src/escudo/**', 'juego/web/src/celular/**', 'juego/web/src/carreras/**', 'juego/web/src/peleas/**', 'juego/web/src/sangre/**', 'juego/web/src/casa/lavado/**', 'juego/web/scripts/probar-mesa-motor.mjs', 'juego/web/scripts/probar-show-motor.mjs', 'juego/web/scripts/probar-cocina-guardado.mjs', 'juego/web/scripts/probar-escudo-motor.mjs', 'juego/web/scripts/probar-celular-guardado.mjs', 'juego/web/scripts/probar-carreras-motor.mjs', 'juego/web/scripts/probar-carreras-guardado.mjs', 'juego/web/scripts/probar-peleas-motor.mjs', 'juego/web/scripts/probar-retrete-guardado.mjs', 'juego/web/scripts/probar-sangre-combate.mjs', 'juego/web/scripts/probar-lavado-enemigos.mjs', 'juego/web/scripts/probar-lavado-movimiento.mjs', 'juego/web/public/modelos/carreras/*.json', 'juego/web/package*.json', '.github/workflows/motores.yml']
  pull_request:
    paths: ['juego/web/src/mesa/**', 'juego/web/src/casa/show_casa.ts', 'juego/web/src/casa/pregunta_dia.ts', 'juego/web/src/casa/cocina/**', 'juego/web/src/casa/cohete.ts', 'juego/web/src/casa/cohete/**', 'juego/web/src/casa/main.ts', 'juego/web/src/sueltos/**', 'juego/web/src/escudo/**', 'juego/web/src/celular/**', 'juego/web/src/carreras/**', 'juego/web/src/peleas/**', 'juego/web/src/sangre/**', 'juego/web/src/casa/lavado/**', 'juego/web/scripts/probar-mesa-motor.mjs', 'juego/web/scripts/probar-show-motor.mjs', 'juego/web/scripts/probar-cocina-guardado.mjs', 'juego/web/scripts/probar-escudo-motor.mjs', 'juego/web/scripts/probar-celular-guardado.mjs', 'juego/web/scripts/probar-carreras-motor.mjs', 'juego/web/scripts/probar-carreras-guardado.mjs', 'juego/web/scripts/probar-peleas-motor.mjs', 'juego/web/scripts/probar-retrete-guardado.mjs', 'juego/web/scripts/probar-sangre-combate.mjs', 'juego/web/scripts/probar-lavado-enemigos.mjs', 'juego/web/scripts/probar-lavado-movimiento.mjs', 'juego/web/public/modelos/carreras/*.json', 'juego/web/package*.json', '.github/workflows/motores.yml']
permissions:
  contents: read
jobs:
  motores:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: juego/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: juego/web/package-lock.json
      - run: npm ci
      - run: npm run probar:motores
