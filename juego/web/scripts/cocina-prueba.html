<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cocina de chef (pruebas)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #231a16;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      Página de pruebas de la cocina de chef (solo en desarrollo: no entra a la APK).
      /scripts/cocina-prueba.html?rol=el&receta=wafles&xp=0&dia=1
      En pareja: &linea=anfitrion|invitado&id=prueba&transporte=local|supabase
      Lo que se guarda queda en window.__guardados.
    -->
    <script type="module">
      import '@fontsource/fredoka/latin-600.css';
      import '@fontsource/nunito/latin-700.css';
      import '@fontsource/nunito/latin-800.css';
      import { activar } from '/src/sonido';
      import { jugarCocina } from '/src/casa/cocina/index';
      import { progresoNuevo } from '/src/casa/cocina/tipos';

      const q = new URLSearchParams(location.search);
      const rol = q.get('rol') === 'ella' ? 'ella' : 'el';
      const otro = rol === 'el' ? 'ella' : 'el';
      const receta = q.get('receta') ?? 'wafles';
      const progreso = { ...progresoNuevo(), xp: Number(q.get('xp') ?? 0), dia: Number(q.get('dia') ?? 1), propinas: Number(q.get('propinas') ?? 0) };
      if (q.get('mejoras')) for (const par of q.get('mejoras').split(',')) {
        const [k, v] = par.split(':');
        progreso.mejoras[k] = Number(v);
      }
      window.__guardados = [];
      addEventListener('pointerdown', () => activar(), { once: true });
      const modo = q.get('linea');
      window.__cocinaCerrada = false;
      jugarCocina({
        rol,
        receta,
        progreso,
        pareja: { rol: otro, nombre: otro === 'el' ? 'Él' : 'Ella' },
        guardar: async (p, dia) => {
          window.__guardados.push({ p, dia });
        },
        linea: modo === 'anfitrion' || modo === 'invitado'
          ? { modo, id: q.get('id') ?? 'prueba', transporte: q.get('transporte') === 'supabase' ? 'supabase' : 'local', nombreOtro: otro === 'el' ? 'Él' : 'Ella' }
          : undefined,
      }).then(() => (window.__cocinaCerrada = true));
    </script>
  </body>
</html>
